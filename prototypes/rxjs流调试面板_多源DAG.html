<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RxJS 流调试面板 · 多源 DAG 原型</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231a1d24'/%3E%3Cpath d='M7 9l9 9-9 9' stroke='%23e8594f' stroke-width='2.4' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M16 9h9' stroke='%234da3ff' stroke-width='2.4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E">
<!-- 真实 RxJS 7（UMD 全局 window.rxjs），用于验证真实算子埋点捕获 -->
<script src="https://cdn.jsdelivr.net/npm/rxjs@7.8.1/dist/bundles/rxjs.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1115; --panel:#161a22; --panel2:#1c212c; --line:#262d3b;
    --ink:#e8ecf3; --muted:#8a94a6; --dim:#5b6475;
    --accent:#4da3ff; --good:#3dd68c; --warn:#f2b04a; --bad:#e8594f;
    --mono:"SFMono-Regular",Consolas,"Roboto Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;height:100vh;overflow:hidden}
  /* ===== 顶部 ===== */
  .topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:10px 16px;background:var(--panel);border-bottom:1px solid var(--line);flex:none}
  .brand{display:flex;align-items:center;gap:9px;margin-right:4px}
  .brand .logo{width:26px;height:26px;flex:none}
  .brand b{font-size:14px}
  .brand span{font-size:11px;color:var(--muted);font-family:var(--mono)}
  .tag{font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);background:var(--panel2);font-family:var(--mono)}
  .tag.live{color:#0f1115;background:var(--good);border-color:transparent;font-weight:600}
  .spacer{flex:1}
  .ctrl{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .btn{appearance:none;border:1px solid var(--line);background:var(--panel2);color:var(--ink);font-size:12.5px;padding:6px 13px;border-radius:7px;cursor:pointer;min-height:34px;display:inline-flex;align-items:center;gap:6px;transition:background .12s,border-color .12s}
  .btn:hover{border-color:var(--accent)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#081018;font-weight:600}
  .btn.sm{font-size:11.5px;padding:4px 10px;min-height:28px}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .lbl{font-size:11px;color:var(--muted)}
  input[type=range]{accent-color:var(--accent);width:90px}

  /* ===== 主体：图 + 检查器 + 模拟页面 ===== */
  .body{flex:1;display:flex;min-height:0;position:relative}
  .stageWrap{flex:1;position:relative;min-width:0}
  #stage{position:absolute;inset:0;display:block;width:100%;height:100%;cursor:pointer}
  .hintbar{position:absolute;left:14px;bottom:12px;display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim);pointer-events:none;z-index:3}
  .hintbar span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex:none}
  .dot.good{background:var(--good)} .dot.warn{background:var(--warn)} .dot.bad{background:var(--bad)} .dot.accent{background:var(--accent)}

  /* 检查器 */
  .inspector{width:330px;flex:none;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
  .ins-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
  .ins-head h3{font-size:12.5px;font-weight:600;flex:1;display:flex;align-items:center;gap:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .ins-head .op-tag{font-family:var(--mono);font-size:10.5px;color:var(--accent);background:var(--panel2);border:1px solid var(--line);padding:1px 7px;border-radius:5px;flex:none}
  .close{appearance:none;border:none;background:none;color:var(--muted);font-size:16px;cursor:pointer;line-height:1;padding:2px 4px}
  .close:hover{color:var(--ink)}
  .ins-body{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:12px}
  .ins-empty{color:var(--dim);font-size:12.5px;line-height:1.7}
  .ins-empty b{color:var(--muted);display:block;margin-bottom:6px;font-size:13px}
  .ins-empty code{color:var(--accent);font-family:var(--mono);font-size:11px}
  .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .kpi .cell{background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:8px;text-align:center}
  .kpi .k{font-size:10px;color:var(--muted);margin-bottom:3px}
  .kpi .v{font-family:var(--mono);font-size:15px;font-weight:600}
  .kpi .v.good{color:var(--good)} .kpi .v.warn{color:var(--warn)} .kpi .v.bad{color:var(--bad)}
  .sec-t{font-size:10.5px;letter-spacing:.6px;color:var(--dim);margin:2px 0 6px;font-family:var(--mono)}
  .stream{display:flex;flex-direction:column;gap:7px;max-height:170px;overflow-y:auto;border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:8px}
  .row{display:flex;align-items:center;gap:7px;font-size:11px;font-family:var(--mono)}
  .row .t{color:var(--dim);flex:none;width:52px}
  .row .p{flex:1;background:#0d1015;border:1px solid var(--line);border-radius:4px;padding:3px 7px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .row .p.out{color:var(--good)} .row .p.dropped{color:var(--bad);text-decoration:line-through}
  .marker{width:7px;height:7px;border-radius:50%;flex:none}
  .marker.in{background:var(--accent)} .marker.out{background:var(--good)} .marker.dropped{background:var(--bad)}
  .desc{font-size:11.5px;color:var(--muted);line-height:1.6;background:var(--panel2);border:1px solid var(--line);border-radius:7px;padding:9px 11px}
  .desc code{color:var(--accent);font-family:var(--mono);font-size:11px}
  .desc .target{color:var(--warn);font-family:var(--mono);font-size:11px}

  /* ===== 模拟业务页面 ===== */
  .simPanel{position:absolute;top:14px;right:14px;z-index:4;width:248px;background:rgba(22,26,34,.94);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.4)}
  .sim-head{display:flex;align-items:center;gap:7px;padding:8px 11px;border-bottom:1px solid var(--line);font-size:11px;color:var(--muted);background:var(--panel2)}
  .sim-head .pill{margin-left:auto;font-family:var(--mono);font-size:9.5px;color:var(--dim)}
  .sim-search{display:flex;align-items:center;gap:7px;padding:9px 11px;border-bottom:1px solid var(--line)}
  .sim-search input{flex:1;background:#0d1015;border:1px solid var(--line);border-radius:6px;color:var(--ink);font-size:13px;padding:6px 9px;outline:none;font-family:var(--sans)}
  .sim-search input:focus{border-color:var(--accent)}
  .sim-search .mic{width:24px;height:24px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px;flex:none}
  .sim-filters{display:flex;gap:7px;padding:8px 11px;border-bottom:1px solid var(--line);flex-wrap:wrap}
  .chip{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--line);color:var(--muted);cursor:pointer;transition:all .15s;background:var(--panel2)}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#081018;font-weight:600}
  .sim-list{min-height:96px;max-height:196px;overflow-y:auto}
  .sim-empty{padding:18px 11px;text-align:center;color:var(--dim);font-size:12px}
  .item{display:flex;align-items:center;gap:9px;padding:8px 11px;border-bottom:1px solid rgba(38,45,59,.6)}
  .item .thumb{width:30px;height:30px;border-radius:6px;flex:none;display:flex;align-items:center;justify-content:center;font-size:14px}
  .item .meta{flex:1;min-width:0}
  .item .nm{font-size:12px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .item .pr{font-size:11px;color:var(--good);font-family:var(--mono);margin-top:1px}
  .sim-status{padding:6px 11px;font-size:10.5px;color:var(--dim);border-top:1px solid var(--line);display:flex;align-items:center;gap:6px;background:var(--panel2)}
  .sim-status .sp{width:7px;height:7px;border-radius:50%;background:var(--dim)}
  .sim-status .sp.ok{background:var(--good)} .sim-status .sp.work{background:var(--warn);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.3}}

  /* DOM 高亮：图节点 hover / DOM hover 的反馈 */
  .glow{outline:2px solid var(--warn) !important;outline-offset:2px;box-shadow:0 0 0 4px rgba(242,176,74,.18)}
  .glow-target{outline:2px solid var(--accent) !important;outline-offset:2px;box-shadow:0 0 0 4px rgba(77,163,255,.2)}

  /* ===== 时间轴 ===== */
  .timeline{display:flex;align-items:center;gap:12px;padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  .tl-status{display:flex;align-items:center;gap:8px;flex:none}
  .tl-rec{font-size:11px;font-family:var(--mono);color:var(--bad);display:inline-flex;align-items:center;gap:5px}
  .tl-rec.off{color:var(--dim)}
  .tl-mode{font-size:10.5px;padding:1px 8px;border-radius:20px;border:1px solid var(--line);color:var(--muted);font-family:var(--mono)}
  .tl-mode.play{color:#0f1115;background:var(--accent);border-color:transparent;font-weight:600}
  .tl-ctrl{display:flex;gap:6px;flex:none}
  .tl-time{font-family:var(--mono);font-size:11.5px;color:var(--muted);flex:none;display:flex;gap:4px;align-items:center}
  #tlSeek{flex:1;min-width:120px;accent-color:var(--accent);height:4px}
  #tlSeek.playback{accent-color:var(--good)}

  /* ===== JSON 展开树 ===== */
  .obj-cell{max-height:140px;overflow-y:auto;line-height:1.55;white-space:pre-wrap;word-break:break-all;background:#0b0e13 !important}
  .jt{font-family:var(--mono);font-size:11px;cursor:default}
  .jhead{display:inline-flex;align-items:center;gap:3px;color:var(--muted)}
  .jtog{cursor:pointer;color:var(--accent);user-select:none;font-size:10px;width:12px;display:inline-block}
  .jlabel{color:var(--muted)}
  .jkey{color:var(--warn)}
  .jleaf.jstr{color:var(--good)}
  .jleaf.jnum{color:var(--accent)}
  .jleaf.jbool{color:#d487e8}
  .jleaf.jnull{color:var(--dim)}
  .jbody{margin-left:12px;border-left:1px dashed var(--line);padding-left:6px;display:block}
  .jrow{display:block;margin:1px 0}

  @media (max-width:820px){
    body{overflow:auto}
    .body{flex-direction:column;min-height:0}
    .stageWrap{height:52vh;flex:none}
    .inspector{width:100%;border-left:none;border-top:1px solid var(--line)}
    .ins-body{max-height:36vh}
    .simPanel{top:auto;bottom:12px;right:12px;width:220px}
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32"><rect width="32" height="32" rx="7" fill="#1a1d24"/><path d="M7 9l9 9-9 9" stroke="#e8594f" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><path d="M16 9h9" stroke="#4da3ff" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg>
    <b>RxJS 流调试面板</b><span>v0.2 · 多源 DAG</span>
  </div>
  <span class="tag live" id="liveTag">● 运行中</span>
  <span class="spacer"></span>
  <div class="ctrl">
    <span class="lbl">布局</span>
    <div class="seg" id="layoutSeg"></div>
  </div>
  <div class="ctrl">
    <button class="btn primary sm" id="btnRun">⏸ 暂停</button>
    <button class="btn sm" id="btnStep">单步</button>
    <button class="btn sm" id="btnReset">重置</button>
    <span class="lbl">速度</span>
    <input type="range" id="speed" min="1" max="10" value="5">
  </div>
</div>

<!-- ===== 录制/回放 时间轴 ===== -->
<div class="timeline" id="timeline">
  <div class="tl-status">
    <span class="tl-rec" id="tlRec">● 录制中</span>
    <span class="tl-mode" id="tlMode">实时</span>
  </div>
  <div class="tl-ctrl">
    <button class="btn sm" id="tlPlay" title="回放播放/暂停">▶ 回放</button>
    <button class="btn sm" id="tlStepB" title="上一帧">‹</button>
    <button class="btn sm" id="tlStepF" title="下一帧">›</button>
    <button class="btn sm" id="tlLive" title="回到实时">● 实时</button>
    <button class="btn sm" id="tlClear" title="清空录制">清空</button>
  </div>
  <input type="range" id="tlSeek" min="0" max="1000" value="0" title="拖动回放">
  <div class="tl-time"><span id="tlNow">00:00</span><span class="tl-sep">/</span><span id="tlDur">00:00</span></div>
</div>

<div class="body">
  <div class="stageWrap">
    <canvas id="stage"></canvas>
    <div class="hintbar">
      <span><i class="dot accent"></i>源</span>
      <span><i class="dot good"></i>渲染目标</span>
      <span><i class="dot warn"></i>hover 节点高亮对应 DOM</span>
      <span style="margin-left:auto">hover 页面上元素反查来源流</span>
    </div>
    <!-- 模拟业务页面：数据流真实渲染到这里，也是 DOM 高亮的目标 -->
    <div class="simPanel" id="simPanel">
      <div class="sim-head">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="14" rx="2"/><path d="M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2"/></svg>
        业务页面 <span class="pill" id="pageStatus">模拟</span>
      </div>
      <div class="sim-search">
        <input id="simInput" type="text" placeholder="搜索商品…" value="" autocomplete="off">
        <div class="mic"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg></div>
      </div>
      <div class="sim-filters" id="simFilters">
        <span class="chip on" data-price="all">全部</span>
        <span class="chip" data-price="lt100">&lt;100</span>
        <span class="chip" data-price="100to500">100-500</span>
        <span class="chip" data-price="gt500">&gt;500</span>
      </div>
      <div class="sim-list" id="simList"><div class="sim-empty">输入关键词搜索，或选择价格区间</div></div>
      <div class="sim-status"><span class="sp" id="simSp"></span><span id="simStatusText">等待输入</span></div>
    </div>
  </div>

  <aside class="inspector" id="inspector">
    <div class="ins-head">
      <h3><i class="dot" id="insDot" style="background:var(--accent)"></i><span id="insTitle">节点检查器</span><span class="op-tag" id="insOp"></span></h3>
      <button class="close" id="insClose" title="关闭">×</button>
    </div>
    <div class="ins-body" id="insBody">
      <div class="ins-empty" id="insEmpty">
        <b>点节点看中途值 · hover 看渲染目标</b>
        这是一张多源 DAG：三个源（搜索 / 价格筛选 / 定时刷新）汇聚后渲染到右侧业务页面。点任意节点看它收到的值；<b>把鼠标悬停在节点上</b>，页面对应渲染区域会高亮；反之 hover 页面上元素，反查哪些流喂给它的渲染。
      </div>
      <div id="insContent" style="display:none;flex-direction:column;gap:12px"></div>
    </div>
  </aside>
</div>

<script>
"use strict";
/* =========================================================
   RxJS 可视化调试面板 v0.2 —— 多源 DAG + 双向 DOM 高亮
   - 纯原生 JS + Canvas，零外部依赖（自实现分层布局）
   - 多源汇聚成 DAG，数据包动画流动
   - 流向渲染目标标记 + 图<->DOM 双向 hover 高亮
   ========================================================= */
const $ = id => document.getElementById(id);
const canvas = $('stage');
const ctx = canvas.getContext('2d');
let W=0,H=0,DPR=1;

function resize(){
  const wrap=canvas.parentElement, rect=wrap.getBoundingClientRect();
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=rect.width; H=rect.height;
  canvas.width=Math.max(1,Math.floor(W*DPR));
  canvas.height=Math.max(1,Math.floor(H*DPR));
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
window.addEventListener('resize',resize);

/* =========================================================
   场景：电商搜索页 —— 三源汇聚 DAG
   ========================================================= */
const SCENARIO = {
  nodes: [
    // 源1：搜索输入
    {id:'srcSearch', kind:'source', op:'searchInput$', label:'搜索框输入', color:'#4da3ff', target:'#simInput', targetName:'搜索框'},
    {id:'deb', kind:'delay', op:'debounceTime(300)', label:'防抖 300ms', color:'#f2b04a', delay:260},
    {id:'dist', kind:'filter', op:'distinctUntilChanged()', label:'去重', color:'#9b7cf2'},
    {id:'switchMap', kind:'merge', op:'switchMap(req)', label:'发起请求·取最新', color:'#4da3ff', delay:420},
    // 源2：价格筛选
    {id:'srcPrice', kind:'source', op:'priceFilter$', label:'价格区间选择', color:'#3dd68c', target:'#simFilters', targetName:'筛选条'},
    // 汇聚
    {id:'combine', kind:'combine', op:'combineLatest()', label:'合并:关键词+价格', color:'#9b7cf2', delay:120},
    {id:'filter', kind:'filter', op:'filter(r => r.items)', label:'过滤空结果', color:'#f2b04a'},
    // 源3：定时刷新
    {id:'srcTimer', kind:'source', op:'refresh$', label:'定时刷新信号', color:'#e8594f'},
    {id:'mapRefresh', kind:'transform', op:'map(→ fetch)', label:'触发重新拉取', color:'#e8594f', delay:200},
    {id:'mapItems', kind:'transform', op:'map(r => r.items)', label:'提取结果列表', color:'#3dd68c'},
    // 渲染目标
    {id:'renderList', kind:'render', op:'render()', label:'渲染 → 结果列表', color:'#3dd68c', target:'#simList', targetName:'结果列表'},
    {id:'renderStatus', kind:'render', op:'render()', label:'渲染 → 状态栏', color:'#8a94a6', target:'#simStatus', targetName:'状态栏'},
  ],
  edges: [
    ['srcSearch','deb'],['deb','dist'],['dist','switchMap'],['switchMap','combine'],
    ['srcPrice','combine'],
    ['combine','filter'],
    ['srcTimer','mapRefresh'],
    ['filter','mapItems'],['mapItems','renderList'],
    ['mapRefresh','renderStatus'],
  ]
};

/* ---------- 图数据 ---------- */
let nodes=[], edges=[], nodeByIdx={};
let nodeLogs={}, nodeCounts={};
let packets=[], running=true, speed=5, raf=null, lastTs=0, emitTimer=0;
let stepQueue=[], sourceEmitCount=0, packetId=0;
let hoverNode=null, hoverDom=null, selectedNode=null;

/* ---------- 录制 / 回放 ----------
   录制：实时运行时把每个包的生命周期事件追加到 recording[]
   recording = [ {t: 相对时间ms, type, ...} ]
   type: 'spawn'(包生成,含src,value) | 'enter'(包进入某节点,含node,value,stage:'in'|'out'|'drop',label)
          | 'edge'(包开始沿某条边移动,含pId,edgeKey) | 'render'(渲染快照,含node,value,domSnap)
   回放：playhead 沿时间轴推进，扫描事件重建状态 */
let recording=[], recStart=0, recClock=0, recMode='live'; // live | playback
let playback=null; // {t, playing, dur, target}
const MAX_REC=4000;
function recAdd(ev){ ev.t=recClock; recording.push(ev); if(recording.length>MAX_REC) recording.shift(); }
function fmtTime(ms){ const s=ms/1000; const m=Math.floor(s/60); const ss=(s%60).toFixed(1).padStart(4,'0'); return (m<10?'0':'')+m+':'+ss; }

function buildGraph(){
  nodes = SCENARIO.nodes.map(n=>({...n}));
  edges = SCENARIO.edges.map(([f,t])=>({from:f,to:t}));
  nodeByIdx={}; nodes.forEach(n=>nodeByIdx[n.id]=n);
  nodeLogs={}; nodeCounts={};
  nodes.forEach(n=>{ nodeLogs[n.id]={in:[],out:[],drop:[]}; nodeCounts[n.id]={in:0,out:0,drop:0}; });
  packets=[]; sourceEmitCount=0; emitTimer=0;
  clearDomHighlights();
}

/* =========================================================
   简化分层布局（DAG）：主链泳道 + 旁支泳道
   - 识别主渲染链（source→renderList）居中横排
   - 其余旁支节点按"泳道偏移"上下错开，避免同层重叠
   ========================================================= */
function layout(){
  if(!nodes.length) return;
  // 计算层级（入度为0为源，逐层推进）
  const level={};
  const incoming={};
  nodes.forEach(n=>incoming[n.id]=edges.filter(e=>e.to===n.id).length);
  let changed=true;
  nodes.forEach(n=>{ if(incoming[n.id]===0) level[n.id]=0; });
  while(changed){
    changed=false;
    for(const e of edges){
      if(level[e.from]!==undefined && level[e.to]===undefined){ level[e.to]=level[e.from]+1; changed=true; }
    }
  }
  // 识别主渲染链：从 renderList 沿入边回溯到源（优先选非 source 的入边，避开旁支源）
  const mainChain=[];
  let cur='renderList';
  mainChain.unshift(cur);
  for(let guard=0; guard<nodes.length+2; guard++){
    const inEdges=edges.filter(e=>e.to===cur);
    if(!inEdges.length) break;
    // 选入边来源里"非 source"且层级最小的算子链（汇聚节点多入边时避开旁支源）
    let cand=inEdges.filter(e=>nodeByIdx[e.from].kind!=='source').sort((a,b)=>level[a.from]-level[b.from])[0];
    if(!cand) cand=inEdges[0];
    cur=cand.from;
    mainChain.unshift(cur);
    if(nodeByIdx[cur].kind==='source') break;
  }
  const mainSet=new Set(mainChain);
  // 旁支泳道偏移（节点 id -> 相对主链的上下偏移层数）
  const laneOffset={
    'srcPrice':-1,
    'srcTimer':1,
    'mapRefresh':1,
    'renderStatus':1
  };
  // ===== 自适应尺寸：根据画布宽 W 缩放节点宽/间距/泳道距/字体 =====
  // 桌面基准 W=760 时 nodeW=170 gapX=62；窄屏按比例压缩，但保留下限
  const mainSlots=mainChain.length-1;
  const padX=12;
  // 目标：主链总宽 = nodeW*(slots+1) + gapX*slots ≈ W - 2*padX
  // 先按 W 算缩放系数
  const baseW=760;
  let scale = W / baseW;
  scale = Math.max(0.52, Math.min(1, scale)); // 下限 0.52（约 395px 宽画布）
  let nodeW = Math.round(170 * scale);
  let gapX  = Math.round(62  * scale);
  let nodeH = Math.round(54  * scale);
  let laneGap = Math.round(104 * scale);
  // 保证主链总宽不超过可用宽度
  const avail = W - padX*2;
  let totalW = nodeW*(mainSlots+1) + gapX*mainSlots;
  if(totalW > avail){
    // 等比压缩到刚好放下
    const k = avail / totalW;
    nodeW = Math.max(84, Math.round(nodeW*k));
    gapX  = Math.max(14, Math.round(gapX*k));
    totalW = nodeW*(mainSlots+1) + gapX*mainSlots;
  }
  // 暴露给绘制层用
  window.__rxflowScale = scale;
  window.__rxflowNodeW = nodeW;
  window.__rxflowNodeH = nodeH;
  // 主链 x 分布
  const chainX={};
  mainChain.forEach((id,i)=>{ chainX[id]=i; });
  // 非主链节点：按自身层级对齐最近的主链 x 槽位
  const slotFor={};
  nodes.forEach(n=>{
    if(!chainX[n.id] && chainX[n.id]!==0){
      const inE=edges.find(e=>e.to===n.id);
      if(inE && chainX[inE.from]!==undefined){ slotFor[n.id]=chainX[inE.from]+1; }
      else { slotFor[n.id]=Math.min(mainChain.length-1, (level[n.id]||0)); }
    }
  });
  const x0=Math.max(padX,(W-totalW)/2);
  const midY=H/2;
  // 主链节点：居中横排
  mainChain.forEach((id,i)=>{
    const n=nodeByIdx[id];
    n.x=x0+i*gapX; n.y=midY-nodeH/2; n.w=nodeW; n.h=nodeH; n.level=i;
  });
  // 旁支节点：按槽位 x + 泳道偏移 y
  nodes.forEach(n=>{
    if(mainSet.has(n.id)) return;
    const slot=slotFor[n.id]!==undefined?slotFor[n.id]:0;
    const off=laneOffset[n.id]||0;
    const x=x0+Math.min(slot,mainSlots)*gapX;
    const y=midY-nodeH/2 + off*laneGap;
    n.x=x; n.y=y; n.w=nodeW; n.h=nodeH; n.level=slot;
  });
}

function rank(n){
  if(n.kind==='render') return 10;
  if(n.kind==='combine') return 5;
  if(n.kind==='merge') return 4;
  if(n.kind==='transform') return 3;
  if(n.kind==='filter') return 2;
  if(n.kind==='delay') return 1;
  if(n.kind==='source') return 0;
  return 6;
}

/* ---------- 数据包 ---------- */
function edgeLen(e){ return Math.abs((nodeByIdx[e.to]?.x||0)-(nodeByIdx[e.from]?.x||0)); }
function nextSourceValue(src){
  const sc=sourceEmitCount;
  if(src.id==='srcSearch'){ const a=['苹','苹果','苹果手','苹果手机','苹果手','苹果','苹']; return a[sc%a.length]; }
  if(src.id==='srcPrice'){ const seq=['全部','<100','100-500','全部','>500','全部']; return seq[Math.floor(sc/2)%seq.length]; }
  if(src.id==='srcTimer') return {tick:sc};
  return sc;
}
function spawnPackets(){
  const interval=Math.max(120,360-speed*26);
  emitTimer-=16;
  if(emitTimer<=0){
    emitTimer=interval;
    if(running||stepQueue.length){
      // 多个源按各自节奏发射：搜索源和价格源同频，定时源稍慢
      spawnSrc('srcSearch', interval);
      if(Math.floor(sourceEmitCount/3)%2===0) spawnSrc('srcPrice', interval);
      if(sourceEmitCount%2===0) spawnSrc('srcTimer', interval*2);
      sourceEmitCount++;
      if(stepQueue.length) stepQueue.shift();
    }
  }
}
function spawnSrc(srcId, interval){
  const src=nodeByIdx[srcId];
  const val=nextSourceValue(src);
  const outEdges=edges.filter(e=>e.from===srcId);
  const firstEdge=outEdges[0];
  const target=nodeByIdx[firstEdge.to];
  const p={id:++packetId, edgeKey:edgeKeyOf(firstEdge), progress:0, value:val, label:safeStr(val), dead:false, held:false, holdMs:0, nodeId:null, color:src.color,
    // 录制时间线：进入每条边的时间(相对 recClock)、经过各节点的处理时间
    tl:{spawn:recClock, edges:[{key:edgeKeyOf(firstEdge), t:recClock}], nodes:[]}};
  packets.push(p);
  recAdd({type:'spawn', pId:p.id, src:srcId, value:val, color:src.color, label:p.label});
  pushLog(target,'in',val);
}
function edgeKeyOf(e){ return e.from+'→'+e.to; }

/* =========================================================
   真实 RxJS 埋点桥接
   真实 RxJS 管道里的每个 tap() 捕获到值后调用 emitReal()，
   由它负责：写节点日志/计数、录制、生成动画包、更新 DOM。
   realRxMode = true 时用真实管道驱动，false 时用模拟引擎降级。
   ========================================================= */
let realRxMode=false, realSubs=[];
function buildPathTo(nodeId){
  // 返回从最近源到该节点的边路径（BFS 找一条源可达路径）
  const prev={};
  const visited=new Set(); let q=['srcSearch','srcPrice','srcTimer'].filter(s=>nodeByIdx[s]);
  q.forEach(s=>visited.add(s));
  let found=null;
  while(q.length){
    const cur=q.shift();
    if(cur===nodeId){ found=true; break; }
    for(const e of edges){
      if(e.from===cur&&!visited.has(e.to)){ visited.add(e.to); prev[e.to]=e.from; q.push(e.to); }
    }
  }
  if(!found) return null;
  const path=[]; let c=nodeId;
  while(prev[c]!==undefined){ path.unshift(c); c=prev[c]; }
  path.unshift(c); // 源
  // 转成边 key 序列
  const keys=[];
  for(let i=0;i<path.length-1;i++) keys.push(path[i]+'→'+path[i+1]);
  return keys;
}
function emitReal(nodeId, value, stage, raw){
  const node=nodeByIdx[nodeId]; if(!node) return;
  // 录制（带真实原始值，raw 用于检查器展示对象结构）
  recAdd({type:'enter', pId:++packetId, node:nodeId, value, label:safeStr(value), stage:stage||'in', raw:raw!==undefined?raw:value});
  if(node.kind==='render'){
    pushLog(node,'in',value);
    node.lastRender=value;
    const snap=snapshotDom();
    applyRender(node,value);
    recAdd({type:'render', node:nodeId, value, snap});
    return;
  }
  if(stage==='drop'){ pushLog(node,'drop',value); return; }
  pushLog(node,'in',value);
  if(stage==='out') pushLog(node,'out',value);
  // 生成一个动画包，沿源→该节点的路径快速流动，展示"真实值到达"
  const path=buildPathTo(nodeId);
  if(path&&path.length){
    const src=nodeByIdx[path[0].split('→')[0]];
    packets.push({id:++packetId, edgeKey:path[0], progress:0, value, label:safeStr(value), dead:false, held:false, holdMs:0, nodeId:null, color:(src&&src.color)||node.color,
      tl:{spawn:recClock, edges:path.map(k=>({key:k,t:recClock})), nodes:[]},
      fastPath:path.slice(1), fastTarget:nodeId});
  }
}

function pushLog(node,kind,val){
  if(!node) return;
  const isObj=val&&typeof val==='object';
  const entry={v:safeStr(val),ts:Date.now()};
  if(isObj) entry.o=val;
  const arr=nodeLogs[node.id][kind];
  if(arr.length>=40) arr.shift();
  arr.push(entry);
  nodeCounts[node.id][kind]++;
}
function safeStr(v){ if(v===undefined)return'undefined'; if(typeof v==='object'&&v){try{return JSON.stringify(v);}catch(e){return String(v);}} return String(v); }

function transformFor(node,val){
  if(node.id==='mapItems'){
    const kw = getKeyword();
    const items=[{n:kw+'·标准款',p:1299},{n:kw+'·Pro版',p:1999},{n:kw+'·青春版',p:899}];
    const price=getPriceSel();
    const filtered = price==='lt100'?items.slice(0,1): price==='100to500'?items.slice(0,0): price==='gt500'?items:items;
    return {items:filtered};
  }
  if(node.id==='combine'){
    const kw=typeof val==='string'?val:(val&&val.search?val.search:getKeyword());
    return {search:kw, price:getPriceSel()};
  }
  if(node.id==='mapRefresh') return {signal:'refresh',ts:Date.now()};
  return val;
}
function decide(node,val){
  if(node.id==='filter'){ if(!val||!val.items||val.items.length===0) return {action:'drop'}; }
  if(node.id==='dist') return {action:'pass'};
  return {action:'pass'};
}
function getKeyword(){ const v=$('simInput').value.trim(); return v||'全部'; }
function getPriceSel(){ const c=document.querySelector('#simFilters .chip.on'); return c?c.dataset.price:'all'; }

/* ---------- 动画主循环（双模式：live 实时 / playback 回放） ---------- */
function frame(ts){
  if(!lastTs) lastTs=ts;
  const dt=Math.min(50,ts-lastTs); lastTs=ts;
  if(recMode==='live'){
    if(running && !realRxMode) spawnPackets();
    recClock+=dt;
    advanceLive(dt);
  } else {
    advancePlayback(dt);
  }
  draw();
  if(selectedNode) refreshInspectorLite();
  raf=requestAnimationFrame(frame);
}

/* 实时推进 */
function advanceLive(dt){
  const distPerFrame=dt*(0.9+speed*0.14);
  // fastPath 包：真实模式下的"快速流动"动画，穿过中间节点直达目标后消失
  for(const p of packets){
    if(p.dead||!p.fastPath) continue;
    const e=edges.find(e=>edgeKeyOf(e)===p.edgeKey);
    if(!e){p.dead=true;continue;}
    const to=nodeByIdx[e.to];
    const len=Math.max(1,Math.abs((to?.x||0)-(nodeByIdx[e.from]?.x||0)));
    p.progress+=distPerFrame*2.2;
    if(p.progress>=len){
      if(p.fastTarget===to.id){ p.dead=true; continue; }
      // 跳到下一条边
      const nextIdx=p.fastPath.indexOf(p.edgeKey);
      if(nextIdx>=0&&p.fastPath[nextIdx+1]){ p.edgeKey=p.fastPath[nextIdx+1]; p.progress=0; }
      else p.dead=true;
    }
  }
  for(const p of packets){
    if(p.dead||p.fastPath) continue;
    if(p.held) continue;
    const e=edges.find(e=>edgeKeyOf(e)===p.edgeKey);
    if(!e){p.dead=true;continue;}
    const from=nodeByIdx[e.from], to=nodeByIdx[e.to];
    const len=Math.max(1,Math.abs((to?.x||0)-(from?.x||0)));
    p.progress+=distPerFrame;
    if(p.progress>=len){
      if(!to){p.dead=true;continue;}
      p.tl.nodes.push({node:to.id, t:recClock});
      recAdd({type:'enter', pId:p.id, node:to.id, value:p.value, label:p.label});
      if(to.kind==='render'){ pushLog(to,'in',p.value); to.lastRender=p.value; const snap=snapshotDom(); applyRender(to,p.value); recAdd({type:'render', node:to.id, value:p.value, snap}); p.dead=true; continue; }
      const dec=decide(to,p.value);
      if(dec.action==='drop'){ pushLog(to,'drop',p.value); p.tl.nodes.push({node:to.id, t:recClock, stage:'drop'}); recAdd({type:'enter', pId:p.id, node:to.id, value:p.value, label:p.label, stage:'drop'}); p.dead=true; continue; }
      let out=p.value;
      if(to.kind==='transform'||to.kind==='combine'||to.kind==='merge'){ out=transformFor(to,p.value); p.value=out; p.label=safeStr(out); }
      pushLog(to,'in',p.value); pushLog(to,'out',p.value);
      recAdd({type:'enter', pId:p.id, node:to.id, value:out, label:p.label, stage:'out'});
      const nextEdge=edges.find(ed=>ed.from===to.id);
      if(!nextEdge){ p.dead=true; continue; }
      if(to.kind==='delay'||to.kind==='merge'||to.kind==='combine'){ p.held=true; p.holdMs=(to.delay||180); p.nodeId=to.id; }
      else { p.edgeKey=edgeKeyOf(nextEdge); p.progress=0; p.tl.edges.push({key:edgeKeyOf(nextEdge), t:recClock}); }
    }
  }
  for(const p of packets){
    if(!p.dead&&p.held){ p.holdMs-=dt; if(p.holdMs<=0){ p.held=false; const e=edges.find(ed=>ed.from===p.nodeId); if(e){ p.edgeKey=edgeKeyOf(e); p.progress=0; p.tl.edges.push({key:edgeKeyOf(e), t:recClock}); } else p.dead=true; } }
  }
  packets=packets.filter(p=>!p.dead);
  // 更新时间轴 UI（录制中）
  updateTimelineUI();
}

/* ---------- 回放 ---------- */
function enterPlayback(){
  if(!recording.length) { enterLive(); return; }
  stopRealRx(); // 回放时暂停真实管道，避免后台写入
  recMode='playback';
  running=false;
  $('btnRun').textContent='▶ 运行'; $('liveTag').textContent='● 回放'; $('liveTag').classList.remove('live');
  $('tlMode').textContent='回放'; $('tlMode').classList.add('play');
  $('tlRec').classList.add('off'); $('tlRec').textContent='● 已停止录制';
  $('tlSeek').classList.add('playback');
  const dur=recording[recording.length-1].t;
  playback={t:0, playing:false, dur};
  $('tlDur').textContent=fmtTime(dur);
  $('tlNow').textContent=fmtTime(0);
  applyPlaybackFrame(0);
}
function enterLive(){
  if(recording.length){
    recClock=recording[recording.length-1].t;
  } else recClock=0;
  recMode='live';
  playback=null;
  if(realRxReady && realSubs.length===0) initRealRx(); // 重新启动真实管道
  $('tlMode').textContent='实时'; $('tlMode').classList.remove('play');
  $('tlRec').classList.remove('off'); $('tlRec').textContent='● 录制中';
  $('tlSeek').classList.remove('playback');
  $('tlPlay').textContent='▶ 回放';
  clearDomHighlights();
  updateTimelineUI();
}
function clearRecording(){
  recording=[]; recClock=0;
  if(recMode!=='live') enterLive();
  else updateTimelineUI();
}
function applyPlaybackFrame(targetT){
  playback.t=Math.max(0,Math.min(playback.dur,targetT));
  const t=playback.t;
  // 重建节点日志与计数
  nodeLogs={}; nodeCounts={};
  nodes.forEach(n=>{ nodeLogs[n.id]={in:[],out:[],drop:[]}; nodeCounts[n.id]={in:0,out:0,drop:0}; });
  packets=[]; 
  // 收集每个包的轨迹事件
  const pEvents={};
  for(const ev of recording){
    if(ev.type==='spawn'){ (pEvents[ev.pId]=pEvents[ev.pId]||{spawn:ev, enters:[], spawnT:ev.t}); }
    else if(ev.type==='enter'){ if(pEvents[ev.pId]){ pEvents[ev.pId].enters.push(ev); } }
  }
  // 重建：先按时间顺序处理节点计数
  for(const ev of recording){
    if(ev.t>t) break;
    if(ev.type==='enter'){
      const n=nodeByIdx[ev.node]; if(!n) continue;
      const stage=ev.stage||'in';
      const entry={v:ev.label||safeStr(ev.value), ts:ev.t};
      nodeLogs[ev.node][stage==='out'?'out':(stage==='drop'?'drop':'in')].push(entry);
      nodeCounts[ev.node][stage==='out'?'out':(stage==='drop'?'drop':'in')]++;
      if(stage==='out'||stage==='in'){ nodeLogs[ev.node].in.push({v:ev.label||safeStr(ev.value),ts:ev.t}); nodeCounts[ev.node].in++; }
    }
  }
  // 重建渲染快照
  for(const ev of recording){
    if(ev.t>t) break;
    if(ev.type==='render'){
      if(ev.snap) restoreDom(ev.snap);
    }
  }
  // 重建包位置：包在其生命周期内按时间移动
  const distPerMs=(0.9+speed*0.14)/1000;
  for(const pid in pEvents){
    const pe=pEvents[pid];
    if(pe.spawnT>t) continue;
    // 找当前应处的边：遍历其进入各节点的时间
    let curEdge=null, curStart=pe.spawnT;
    // 用 recording 里的 spawn 决定初始边
    const spawnRec=pe.spawn;
    const srcId=spawnRec.src;
    const firstEdge=edges.find(e=>e.from===srcId);
    curEdge=firstEdge?edgeKeyOf(firstEdge):null;
    let curT=pe.spawnT;
    // 沿 enters 推进
    let done=false;
    for(const en of pe.enters){
      if(en.t<=t){ 
        const to=nodeByIdx[en.node];
        if(!to) continue;
        // 到该节点后，找下一出口
        const nextEdge=edges.find(ed=>ed.from===en.node);
        if(nextEdge){ curEdge=edgeKeyOf(nextEdge); curT=en.t; }
        else { curEdge=null; curT=en.t; }
        if(to.kind==='render'){ curEdge=null; }
      } else { done=true; break; }
    }
    if(curEdge===null) continue; // 已到达终点/丢弃
    // 计算进度
    const prog=(t-curT)*distPerMs;
    packets.push({id:pid, edgeKey:curEdge, progress:prog, value:pe.spawn.value, label:pe.spawn.label, dead:false, held:false, color:pe.spawn.color});
  }
  $('tlNow').textContent=fmtTime(t);
  const seek=Math.round(t/playback.dur*1000);
  $('tlSeek').value=seek;
}
function advancePlayback(dt){
  if(!playback) return;
  if(playback.playing){
    playback.t+=dt*(1.0);
    if(playback.t>=playback.dur){ playback.t=playback.dur; playback.playing=false; $('tlPlay').textContent='▶ 回放'; }
    applyPlaybackFrame(playback.t);
    updateTimelineUI();
  }
}
function snapshotDom(){
  return {
    kw:$('simInput').value,
    price:(document.querySelector('#simFilters .chip.on')||{}).dataset&&(document.querySelector('#simFilters .chip.on')||{}).dataset.price||'all',
    list:$('simList').innerHTML,
    statusText:$('simStatusText').textContent,
    statusOk:$('simSp').className.indexOf('ok')>=0
  };
}
function restoreDom(s){
  if(!s) return;
  if(s.kw!==undefined) $('simInput').value=s.kw;
  if(s.price){ document.querySelectorAll('#simFilters .chip').forEach(c=>c.classList.toggle('on', c.dataset.price===s.price)); }
  if(s.list) $('simList').innerHTML=s.list;
  if(s.statusText) $('simStatusText').textContent=s.statusText;
  $('simSp').className='sp '+(s.statusOk?'ok':'');
}
function updateTimelineUI(){
  const dur=recording.length?recording[recording.length-1].t:0;
  $('tlDur').textContent=fmtTime(dur);
  if(recMode==='live') $('tlNow').textContent=fmtTime(recClock);
}

/* =========================================================
   真实 RxJS 埋点层
   用真实 RxJS 构造演示管道，每个算子间 tap() 捕获真实值喂给面板。
   搜索源用 fromEvent(搜索框 input) —— 真实 DOM 事件；
   定时源用 interval；价格源用 fromEvent(筛选 chip click)。
   若 window.rxjs 加载失败，realRxMode=false，回退到模拟引擎。
   ========================================================= */
let realRxReady=false, realDemoTimer=null;
function initRealRx(){
  const R=window.rxjs;
  if(!R) return; // CDN 未加载，保持模拟模式
  const {fromEvent, interval, of, timer, combineLatest, debounceTime, distinctUntilChanged, switchMap, map, filter, tap, delay, startWith}=R;
  realRxMode=true; realRxReady=true;
  // 自动演示：周期性往搜索框填入递增关键词，触发真实 input 事件
  const kwArr=['苹','苹果','苹果手','苹果手机','苹果手','苹果','苹'];
  let ki=0;
  if(realDemoTimer) clearInterval(realDemoTimer);
  realDemoTimer=setInterval(()=>{
    if(!running||recMode!=='live') return;
    const inp=$('simInput');
    inp.value=kwArr[ki++%kwArr.length];
    inp.dispatchEvent(new Event('input',{bubbles:true}));
  }, 1500);

function draw(){
  ctx.clearRect(0,0,W,H);
  // 网格
  ctx.strokeStyle='rgba(38,45,59,.45)'; ctx.lineWidth=1; const gs=28;
  for(let x=gs*.5;x<W;x+=gs){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for(let y=gs*.5;y<H;y+=gs){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}

}
function nodeById(id){return nodeByIdx[id];}
function drawEdges(){
  for(const e of edges){
    const a=nodeById(e.from),b=nodeById(e.to);
    if(!a||!b)continue;
    const highlighted = hoverDom&&(hoverDom.some(n=>n.id===a.id)||hoverDom.some(n=>n.id===b.id));
    const x1=a.x+a.w,y1=a.y+a.h/2, x2=b.x,y2=b.y+b.h/2;
    ctx.strokeStyle = highlighted?'rgba(77,163,255,.9)':'rgba(255,255,255,.09)';
    ctx.lineWidth = highlighted?2.5:1.5;
    ctx.beginPath(); ctx.moveTo(x1,y1);
    const mx=(x1+x2)/2;
    ctx.bezierCurveTo(mx,y1,mx,y2,x2,y2);
    ctx.stroke();
    ctx.fillStyle=highlighted?'rgba(77,163,255,.95)':'rgba(255,255,255,.16)';
    const ang=Math.atan2(y2-y1,x2-x1);
    ctx.beginPath(); ctx.moveTo(x2,y2);
    ctx.lineTo(x2-8*Math.cos(ang-.4),y2-8*Math.sin(ang-.4));
    ctx.lineTo(x2-8*Math.cos(ang+.4),y2-8*Math.sin(ang+.4));
    ctx.closePath(); ctx.fill();
  }
}
function drawPackets(){
  for(const p of packets){
    if(p.dead)continue;
    const e=edges.find(ed=>edgeKeyOf(ed)===p.edgeKey);
    if(!e)continue;
    const a=nodeById(e.from),b=nodeById(e.to);
    if(!a||!b)continue;
    const len=Math.max(1,Math.abs(b.x-a.x));
    const t=Math.min(1,p.progress/len);
    const x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2;
    const mx=(x1+x2)/2;
    const cx=(1-t)*(1-t)*x1+2*(1-t)*t*mx+t*t*x2;
    const cy=(1-t)*(1-t)*y1+2*(1-t)*t*mx_2(y1,y2)+t*t*y2;
    ctx.beginPath();ctx.arc(cx,cy,9,0,Math.PI*2);ctx.fillStyle='rgba(77,163,255,.15)';ctx.fill();
    const bw=Math.max(30,Math.min(84,10+p.label.length*6)); const bh=19;
    ctx.fillStyle='#10141b'; ctx.strokeStyle=p.color||'#2c3547'; ctx.lineWidth=1.2;
    rRect(cx-bw/2,cy-bh/2,bw,bh,5); ctx.fill(); ctx.stroke();
    ctx.fillStyle='#cfe4ff'; ctx.font='10px monospace'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(shorten(p.label,12),cx,cy+.5);
  }
}
function mx_2(a,b){return (a+b)/2;}
function rRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();}
function shorten(s,n){return s.length>n?s.slice(0,n-1)+'…':s;}
function drawNodes(){

  const fsLb = Math.max(8,   Math.round(10 * scale * 10)/10);   // 标签字号
  const fsTg = Math.max(7.5, Math.round(8.5 * scale * 10)/10);   // 渲染目标字号

    const isSrc=n.kind==='source', isRender=n.kind==='render';

    ctx.strokeStyle = (hl||domHl)?'#ffffff':n.color;
    ctx.lineWidth = (hl||domHl)?2.2:1.5;
    rRect(n.x,n.y,n.w,n.h,9); ctx.fill(); ctx.stroke();

    ctx.fillStyle=n.color; rRect(n.x+1,n.y+8,barW,n.h-16,2); ctx.fill();
    // 可用文字宽度（节点内边距）

// 按可用像素宽度截断文字（Canvas 没有自动 ellipsis，用 measureText 实现）
function fitText(str, maxW, fontSize){
  if(!str) return '';
  ctx.font = '600 '+fontSize+'px sans-serif';
  if(ctx.measureText(str).width <= maxW) return str;
  // 逐步截短
  let s = str;
  while(s.length>1 && ctx.measureText(s+'…').width > maxW){
    s = s.slice(0,-1);
  }
  return s + '…';
}
function drawBadge(n,c,scale){

  if(c.out)items.push([c.out,'#3dd68c']);
  if(c.drop)items.push([c.drop,'#e8594f']);
  const r = Math.max(6, 9*scale);

  for(const[v,col]of items){
    const txt=String(v), wpx=r*2; bx-=wpx;
    ctx.fillStyle=col;ctx.beginPath();ctx.arc(bx+wpx/2,n.y+n.h/2,r,0,Math.PI*2);ctx.fill();
    ctx.fillStyle='#081018';ctx.font='bold '+Math.max(8,Math.round(9*scale))+'px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(txt,bx+wpx/2,n.y+n.h/2+.5); bx-=4;

}
